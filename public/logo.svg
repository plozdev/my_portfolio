<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Soft Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Outer Border Glow Filter -->
    <filter id="borderGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="16" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Dark Gradient Background -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e131b" />
      <stop offset="100%" stop-color="#080a0e" />
    </linearGradient>
  </defs>

  <!-- Squircle Container with Neon Green Border & Glow -->
  <rect 
    x="32" 
    y="32" 
    width="448" 
    height="448" 
    rx="104" 
    fill="url(#bgGradient)" 
    stroke="#22C55E" 
    stroke-width="10"
    filter="url(#borderGlow)"
  />

  <!-- HM Logo Mark Group -->
  <g transform="translate(0, 5)">
    <!-- White H -->
    <!-- H Left Stem -->
    <rect x="98" y="145" width="38" height="210" rx="3" fill="#FFFFFF" />
    <!-- H Crossbar -->
    <rect x="136" y="235" width="56" height="34" fill="#FFFFFF" />
    <!-- H Right Stem -->
    <rect x="192" y="145" width="38" height="210" rx="3" fill="#FFFFFF" />

    <!-- Green M -->
    <path 
      d="M 234 145 L 302 265 L 370 145 H 408 V 355 H 370 V 222 L 314 312 H 290 L 234 222 Z" 
      fill="#22C55E" 
      filter="url(#neonGlow)"
    />

    <!-- Green Underscore Accent _ -->
    <rect x="352" y="380" width="64" height="20" rx="4" fill="#22C55E" filter="url(#neonGlow)" />
  </g>
</svg>
